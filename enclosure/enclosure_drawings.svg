<text x="70.0" y="860.0" class="h" text-anchor="start">NOTES</text>
<text x="70.0" y="880.0" class="note" text-anchor="start">1. All dimensions in mm unless noted. Overall 89.8 × 61.5 × 52.2 mm (3.54 × 2.42 × 2.06 in). Walls and floor 2 mm; 0.4 mm clearance around parts.</text>
<text x="70.0" y="900.0" class="note" text-anchor="start">2. One-piece open-top tray, printed bottom-down. Electronics go in from the top; the Cardputer drops in last (friction fit) and acts as the lid.</text>
<text x="70.0" y="920.0" class="note" text-anchor="start">3. MEASURE before printing: HAT component height, HAT mounting holes (Raspberry Pi pattern assumed), SIM slot position, Cardputer USB-C and switch positions.</text>
<text x="70.0" y="940.0" class="note" text-anchor="start">4. Lower bay: LiPo + 5 V boost/charger between the standoff rows. LTE antenna goes on a side wall, away from the battery.</text>
<text x="70.0" y="960.0" class="note" text-anchor="start">5. Dashed lines = hidden edges. Hatched/gray = cut material in the section view.</text>
</svg>