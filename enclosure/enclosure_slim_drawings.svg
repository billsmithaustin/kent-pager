<text x="70.0" y="860.0" class="h" text-anchor="start">NOTES</text>
<text x="70.0" y="880.0" class="note" text-anchor="start">1. mm unless noted. Case 88.8 × 58.8 × 40.4 mm (3.50 × 2.31 × 1.59 in); about 1.83 in thick with the belt clip. Walls/floor 2 mm.</text>
<text x="70.0" y="900.0" class="note" text-anchor="start">2. Modem: DFRobot Gravity A7670G (TEL0163), 60 × 52 mm, mounting holes Ø3.1 (from DFRobot's drawing). Remove its screw terminal block (tallest part) to save ~3 mm.</text>
<text x="70.0" y="920.0" class="note" text-anchor="start">3. Battery sits under the modem board; the 5 V boost/charger sits beside it. SIM must be fitted before assembly (no outside access).</text>
<text x="70.0" y="940.0" class="note" text-anchor="start">4. Belt clip: a store-bought pager/phone clip screwed through the floor, or a printed PETG clip. Device hangs with the keyboard facing out.</text>
<text x="70.0" y="960.0" class="note" text-anchor="start">5. Draft: MEASURE the real parts (board heights, battery, Cardputer USB-C and switch positions) before printing.</text>
</svg>