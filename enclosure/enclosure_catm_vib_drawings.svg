<text x="70.0" y="860.0" class="h" text-anchor="start">NOTES</text>
<text x="70.0" y="880.0" class="note" text-anchor="start">1. mm unless noted. Case 88.8 × 58.8 × 31.6 mm (3.50 × 2.31 × 1.24 in); about 1.48 in thick with the belt clip. Walls/floor 2 mm.</text>
<text x="70.0" y="900.0" class="note" text-anchor="start">2. Modem: M5Stack Unit CatM (U128, SIM7080G), 72 × 24 × 8 mm per M5Stack. Lies flat in the bay under the Cardputer, held by the rail and foam tape. Lift the Cardputer out to reach its SIM.</text>
<text x="70.0" y="920.0" class="note" text-anchor="start">3. No second battery, boost board or charging socket: the unit runs from the Cardputer's EXT header (5VOUT, GND, G15/G13) through a cut Grove cable. Charge through the Cardputer's USB-C. Verify 5VOUT handles the modem's peaks first.</text>
<text x="70.0" y="940.0" class="note" text-anchor="start">4. Antenna: the supplied SMA antenna screws on through the left-end hole and sticks out. Tidier: an SMA-to-u.FL pigtail and a stick-on flexible LTE antenna inside the bay, and leave the hole out.</text>
<text x="70.0" y="960.0" class="note" text-anchor="start">5. Vibration: M5Stack Unit Vibrator (U059), driver built in, in the front of the bay. Its Grove cable is cut and wired to EXT 5VOUT, GND and G5 (signal). Draft: MEASURE the real parts before printing.</text>
</svg>